workflows:
  ios-release:
    name: iOS Shadow Ledger TestFlight Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: latest
      xcode: latest
      ios_signing:
        provisioning_profiles:
          - Shadow_Ledger_AppStore
        certificates:
          - roya_dist_cert
    scripts:
      - name: Install dependencies
        script: |
          npm ci
      - name: Build web production bundle
        script: |
          npm run build
      - name: Sync iOS Capacitor project
        script: |
          npx cap sync ios
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles --project ios/App/App.xcodeproj --export-options-plist /Users/builder/export_options.plist
      - name: Build and package IPA for TestFlight
        script: |
          cd ios/App
          xcodebuild build \
            -project App.xcodeproj \
            -scheme App \
            -destination "generic/platform=iOS" \
            -archivePath build/App.xcarchive \
            archive
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist /Users/builder/export_options.plist \
            -exportPath build/output
    artifacts:
      - ios/App/build/output/*.ipa
      - dist/**/*
